<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
</head>
<body>
    <!-- Product table -->
    <table border="">
        <caption>T-Shirt Size Chart</caption>
        <thead>
            <tr>
                <th>Product</th>
                <th>Size</th>
                <th>Length</th>
                <th>Availability</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td rowspan="3">T-Shirt</td>
                <td>S</td>
                <td>26</td>
                <td>Available</td>
            </tr>
            <tr>
                <td>M</td>
                <td>28</td>
                <td>Out of Stock</td>
            </tr>
            <tr>
                <td>L</td>
                <td>30</td>
                <td>Limited piece only</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="3">T-Shirt Size Chart</td>
                <td>2026</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
