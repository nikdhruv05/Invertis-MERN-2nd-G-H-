<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <table border="1">
      <caption>
        T-Shirt Size Chart
      </caption>
      <thead>
        <tr>
          <th>Product</th>

          <th>Size</th>

          <th>Chest</th>

          <th>Length</th>

          <th>Availability</th>
        </tr>
      </thead>

      <tbody>
        <tr>
          <th rowspan="3">T-Shirt</th>

          <td>S</td>
          <td>36"</td>
          <td>26"</td>
          <td>Available</td>
        </tr>

        <tr>
          <td>M</td>
          <td>38"</td>
          <td>27"</td>
          <td>Available</td>
        </tr>

        <tr>
          <td>L</td>
          <td>40"</td>
          <td>28"</td>
          <td>Out of Stock</td>
        </tr>
      </tbody>

      <tfoot>
        <tr>
          <td colspan="4">Size Chart Updated</td>

          <td>2026</td>
        </tr>
      </tfoot>
    </table>
  </body>
</html>
