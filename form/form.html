<!DOCTYPE html>
<html>

<head>
    <title>Student Registration</title>
</head>

<body>

    <h1>Student Registration</h1>

    <form action="/register" method="post">

        <div>
            <label for="name">
                Full Name
            </label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your full name"
                required>
        </div>

        <br>

        <div>
            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required>
        </div>

        <br>

        <div>
            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required>
        </div>

        <br>

        <div>
            <label for="age">
                Age
            </label>

            <input
                type="number"
                id="age"
                name="age"
                min="18"
                max="60"
                required>
        </div>
        <br>
        <div>
            <label for="number">Number</label>
            <input type="number" id="number" name="number">
        </div>

        <br>

        <button type="submit">
            Register
        </button>

    </form>

</body>

</html>
